# Builds and publishes the operator image when a release tag (vX.Y) is pushed.
# Mirrors "make docker-buildx": cross-compiles the Go binary for every platform (no emulation).
name: Publish operator image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag from the release tag (v1.20 -> 1.20)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Same transformation as the Makefile target docker-buildx: build stage runs on the build platform.
      - name: Prepare cross-platform Dockerfile
        run: sed -e '1 s/\(^FROM\)/FROM --platform=\${BUILDPLATFORM}/' Dockerfile > Dockerfile.cross

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cross
          platforms: linux/arm64,linux/amd64,linux/s390x,linux/ppc64le
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.VERSION }}
